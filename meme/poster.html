<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GTA VI waited 13 years</title>
<link rel="stylesheet" href="poster.css">
</head>
<body>
<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A white ghost holding a magenta coin on a Vice City beach at sunset, headline: 13 years later, GTA VI is finally here">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c0b33"/>
      <stop offset="0.42" stop-color="#7b1e6e"/>
      <stop offset="0.66" stop-color="#e83e7a"/>
      <stop offset="0.85" stop-color="#ff8a4c"/>
      <stop offset="1" stop-color="#ffc46b"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a5c"/>
      <stop offset="1" stop-color="#3d1a5e"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9b877"/>
      <stop offset="1" stop-color="#c98d4e"/>
    </linearGradient>
    <!-- four-pointed star, reused for the ghost's eyes, the coin and the sky -->
    <path id="star4" d="M0,-30 C5,-9 9,-5 30,0 C9,5 5,9 0,30 C-5,9 -9,5 -30,0 C-9,-5 -5,-9 0,-30 Z"/>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="1024" height="640" fill="url(#sky)"/>

  <!-- early stars -->
  <g fill="#ffffff" opacity="0.85">
    <use href="#star4" transform="translate(180,180) scale(0.28)"/>
    <use href="#star4" transform="translate(850,140) scale(0.22)"/>
    <use href="#star4" transform="translate(620,110) scale(0.18)"/>
    <use href="#star4" transform="translate(380,90) scale(0.16)"/>
  </g>

  <!-- birds -->
  <g stroke="#1c0b33" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M300,290 Q307,281 314,290 Q321,281 328,290"/>
    <path d="M690,240 Q697,231 704,240 Q711,231 718,240"/>
    <path d="M830,320 Q837,311 844,320 Q851,311 858,320"/>
  </g>

  <!-- sun, off to the right so the ghost stands against dark sky -->
  <circle cx="790" cy="545" r="130" fill="#fff3b0" opacity="0.22"/>
  <circle cx="790" cy="545" r="92" fill="#fff3b0"/>

  <!-- skyline silhouettes -->
  <g fill="#1e0b38">
    <rect x="0" y="560" width="70" height="80"/>
    <rect x="85" y="500" width="85" height="140"/>
    <rect x="185" y="570" width="80" height="70"/>
    <rect x="280" y="520" width="70" height="120"/>
    <rect x="690" y="555" width="80" height="85"/>
    <rect x="785" y="590" width="75" height="50"/>
    <rect x="875" y="540" width="75" height="100"/>
    <rect x="965" y="575" width="59" height="65"/>
  </g>
  <!-- antenna on one tower -->
  <line x1="315" y1="520" x2="315" y2="488" stroke="#1e0b38" stroke-width="5"/>
  <!-- neon windows -->
  <g>
    <rect x="100" y="520" width="9" height="13" fill="#ff2e88"/>
    <rect x="125" y="545" width="9" height="13" fill="#00e5ff"/>
    <rect x="100" y="575" width="9" height="13" fill="#ffd166"/>
    <rect x="145" y="520" width="9" height="13" fill="#00e5ff"/>
    <rect x="300" y="540" width="9" height="13" fill="#ff2e88"/>
    <rect x="300" y="575" width="9" height="13" fill="#ffd166"/>
    <rect x="710" y="575" width="9" height="13" fill="#00e5ff"/>
    <rect x="735" y="600" width="9" height="13" fill="#ff2e88"/>
    <rect x="895" y="560" width="9" height="13" fill="#ffd166"/>
    <rect x="895" y="590" width="9" height="13" fill="#00e5ff"/>
    <rect x="920" y="575" width="9" height="13" fill="#ff2e88"/>
    <rect x="985" y="595" width="9" height="13" fill="#ffd166"/>
  </g>

  <!-- sea -->
  <rect x="0" y="640" width="1024" height="130" fill="url(#sea)"/>
  <!-- sun reflection on the water -->
  <g fill="#ffd166" opacity="0.5">
    <rect x="700" y="660" width="180" height="6" rx="3"/>
    <rect x="670" y="690" width="240" height="6" rx="3"/>
    <rect x="640" y="720" width="300" height="6" rx="3"/>
  </g>
  <g stroke="#ffffff" stroke-width="3" opacity="0.18" fill="none">
    <path d="M80,680 Q160,672 240,680"/>
    <path d="M120,725 Q220,717 320,725"/>
    <path d="M880,700 Q930,694 980,700"/>
  </g>

  <!-- sand -->
  <rect x="0" y="770" width="1024" height="254" fill="url(#sand)"/>
  <g>
    <circle cx="150" cy="880" r="6" fill="#b97a3e"/>
    <circle cx="880" cy="900" r="6" fill="#b97a3e"/>
    <circle cx="830" cy="850" r="5" fill="#ffffff" opacity="0.55"/>
    <circle cx="210" cy="940" r="5" fill="#ffffff" opacity="0.55"/>
  </g>

  <!-- palm trees, framing the scene -->
  <g stroke="#12061f" stroke-width="11" fill="none" stroke-linecap="round">
    <g transform="translate(115,805)">
      <path d="M0,0 C-8,-70 6,-150 -16,-215" stroke-width="16"/>
      <path d="M-16,-215 Q-75,-245 -118,-205"/>
      <path d="M-16,-215 Q-60,-265 -105,-262"/>
      <path d="M-16,-215 Q-12,-280 -32,-298"/>
      <path d="M-16,-215 Q35,-268 78,-252"/>
      <path d="M-16,-215 Q65,-232 108,-198"/>
      <circle cx="-26" cy="-205" r="9" fill="#12061f" stroke="none"/>
      <circle cx="-8" cy="-198" r="8" fill="#12061f" stroke="none"/>
    </g>
    <g transform="translate(909,815) scale(-1,1)">
      <path d="M0,0 C-8,-70 6,-150 -16,-215" stroke-width="16"/>
      <path d="M-16,-215 Q-75,-245 -118,-205"/>
      <path d="M-16,-215 Q-60,-265 -105,-262"/>
      <path d="M-16,-215 Q-12,-280 -32,-298"/>
      <path d="M-16,-215 Q35,-268 78,-252"/>
      <path d="M-16,-215 Q65,-232 108,-198"/>
      <circle cx="-26" cy="-205" r="9" fill="#12061f" stroke="none"/>
      <circle cx="-8" cy="-198" r="8" fill="#12061f" stroke="none"/>
    </g>
  </g>

  <!-- shadow under the ghost -->
  <ellipse cx="512" cy="838" rx="175" ry="16" fill="#7a4a1e" opacity="0.25"/>

  <!-- the make.fun ghost: white body, thick black outline, two black
       four-pointed star eyes, one round hand holding a magenta coin -->
  <g>
    <path d="M362,795 V630 C362,530 425,465 512,465 C599,465 662,530 662,630 V795 Q640,758 618,795 Q596,758 574,795 Q552,758 530,795 Q508,758 486,795 Q464,758 442,795 Q420,758 398,795 Q376,758 362,795 Z"
      fill="#ffffff" stroke="#111111" stroke-width="10" stroke-linejoin="round"/>
    <use href="#star4" transform="translate(462,600)" fill="#111111"/>
    <use href="#star4" transform="translate(562,600)" fill="#111111"/>
    <!-- round little hand at the body's edge, tucked under the coin -->
    <circle cx="678" cy="648" r="30" fill="#ffffff" stroke="#111111" stroke-width="8"/>
    <!-- magenta coin with a white star, held up by the hand -->
    <circle cx="722" cy="592" r="62" fill="#ff2e88" stroke="#111111" stroke-width="8"/>
    <use href="#star4" transform="translate(722,592) scale(0.95)" fill="#ffffff"/>
  </g>

  <!-- headline -->
  <text x="512" y="128" text-anchor="middle" font-size="96" font-weight="900" letter-spacing="2" fill="#ffffff" stroke="#111111" stroke-width="10" paint-order="stroke">13 YEARS LATER</text>
  <text x="512" y="202" text-anchor="middle" font-size="46" font-weight="800" fill="#ffd166" stroke="#111111" stroke-width="6" paint-order="stroke">GTA VI IS FINALLY HERE</text>
  <text x="512" y="972" text-anchor="middle" font-size="40" font-weight="700" fill="#ffffff" stroke="#111111" stroke-width="6" paint-order="stroke">Worth every coin.</text>
</svg>
</body>
</html>
